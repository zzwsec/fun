name: nginx static container build

# Reusable workflow inputs:
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#using-inputs-and-secrets-in-a-reusable-workflow
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      nginx_version:
        description: nginx source version to build
        required: true
        type: string
      alpine_image:
        required: true
        type: string
env:
  IMAGE_NAME: ${{ inputs.image_name }}
  ALPINE_IMAGE: ${{ inputs.alpine_image }}
  NGINX_VERSION: ${{ inputs.nginx_version }}

permissions:
  contents: read

jobs:
  build_docker:
    # Run each target on a native runner instead of cross-compiling through QEMU.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux/amd64
            arch: amd64

          - os: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Each runner pushes an immutable platform digest. No shared tag is written here,
      # which prevents amd64 and arm64 jobs from racing with each other.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: nginx/static
          file: nginx/static/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE }}
            NGINX_VERSION=${{ env.NGINX_VERSION }}
          outputs: type=image,name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # The empty filename encodes the sha256 digest for the merge job.
      # https://docs.github.com/en/actions/tutorials/store-and-share-data
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: static-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04

    # Wait until every matrix build has published its platform digest.
    needs:
      - build_docker

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: static-digests-*
          merge-multiple: true

      # Assemble one multi-platform tag from the immutable per-platform digests.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ env.NGINX_VERSION }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools inspect "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${{ env.NGINX_VERSION }}"
