name: nginx debug container build

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: nginx source version to build
        required: true
        type: string
        default: "1.31.3"

env:
  IMAGE_NAME: nginx
  NGINX_VERSION: ${{ inputs.nginx_version }}

permissions:
  contents: read

concurrency:
  group: nginx-debug-${{ inputs.nginx_version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux/amd64
            arch: amd64

          - os: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: nginx/debug
          file: nginx/debug/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
          outputs: type=image,name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: nginx-debug-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform image
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: nginx-debug-digests-*
          merge-multiple: true

      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create --tag "${image}:${NGINX_VERSION}-debug" $(printf "${image}@sha256:%s " *)

      - name: Inspect image
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools inspect "${image}:${NGINX_VERSION}-debug"
