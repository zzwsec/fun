name: PHP container build

on:
  push:
    branches: [main]
    paths:
      - php/8.5/**
      - .github/workflows/php.yaml
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version to build (leave blank to use the Dockerfile default)
        type: string
        required: false
  workflow_call:
    inputs:
      php_version:
        description: PHP version to build (leave blank to use the Dockerfile default)
        type: string
        required: false
    secrets:
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/php
  PHP_CONTEXT: php/8.5

permissions:
  contents: read

concurrency:
  group: php-container-build
  cancel-in-progress: false

jobs:
  build:
    name: Build PHP (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-26.04, arch: amd64 }
          - { os: ubuntu-26.04-arm, arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.PHP_CONTEXT }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ inputs.php_version && format('PHP_VERSION={0}', inputs.php_version) || '' }}
          cache-from: type=gha,scope=php-8.5-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-8.5-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p /tmp/php-digests
          printf '%s\n' "${DIGEST:?Missing image digest}" > "/tmp/php-digests/${ARCH}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: php-digest-${{ matrix.arch }}
          path: /tmp/php-digests/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  merge:
    name: Publish PHP multi-platform image
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/php-digests
          pattern: php-digest-*
          merge-multiple: true

      - name: Publish multi-platform image
        shell: bash
        env:
          PHP_VERSION: ${{ inputs.php_version }}
        run: |
          set -euo pipefail
          version="${PHP_VERSION:-$(sed -n 's/^ARG PHP_VERSION=//p' "${PHP_CONTEXT}/Dockerfile" | head -n 1)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid PHP version: '${version}' (expected X.Y.Z)" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${version%.*}" \
            -t "${IMAGE}:${version}" \
            "${IMAGE}@$(cat /tmp/php-digests/amd64)" \
            "${IMAGE}@$(cat /tmp/php-digests/arm64)"
          docker buildx imagetools inspect "${IMAGE}:${version}"