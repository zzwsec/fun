name: nginx static and dynamic container build

# Reusable workflow inputs:
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#using-inputs-and-secrets-in-a-reusable-workflow
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      nginx_version:
        description: nginx source version to build
        required: true
        type: string
      alpine_image:
        required: true
        type: string
env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}
  ALPINE_IMAGE: ${{ inputs.alpine_image }}
  NGINX_VERSION: ${{ inputs.nginx_version }}

permissions:
  contents: read

jobs:
  build_docker:
    # Run each target on a native runner instead of cross-compiling through QEMU.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux/amd64
            arch: amd64

          - os: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      # Each runner pushes an immutable platform digest. No shared tag is written here,
      # which prevents amd64 and arm64 jobs from racing with each other.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Build static image and push by digest
        id: static
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: nginx/base
          target: static
          platforms: ${{ matrix.platform }}
          build-args: |
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE }}
            NGINX_VERSION=${{ env.NGINX_VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build dynamic image and push by digest
        id: dynamic
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: nginx/base
          target: dynamic
          platforms: ${{ matrix.platform }}
          build-args: |
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE }}
            NGINX_VERSION=${{ env.NGINX_VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        env:
          STATIC_DIGEST: ${{ steps.static.outputs.digest }}
          DYNAMIC_DIGEST: ${{ steps.dynamic.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          printf '%s\n' "${STATIC_DIGEST:?Missing static digest}" > /tmp/digests/static-${{ matrix.arch }}
          printf '%s\n' "${DYNAMIC_DIGEST:?Missing dynamic digest}" > /tmp/digests/dynamic-${{ matrix.arch }}

      # https://docs.github.com/en/actions/tutorials/store-and-share-data
      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: nginx-digests-${{ matrix.arch }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04

    # Wait until every matrix build has published its platform digest.
    needs:
      - build_docker

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: nginx-digests-*
          merge-multiple: true

      # Assemble each image from its two platform digests.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${NGINX_VERSION}" \
            "${IMAGE}@$(cat static-amd64)" "${IMAGE}@$(cat static-arm64)"

          docker buildx imagetools create \
            -t "${IMAGE}:${NGINX_VERSION}-dynamic" \
            "${IMAGE}@$(cat dynamic-amd64)" "${IMAGE}@$(cat dynamic-arm64)"

      - name: Inspect images
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${NGINX_VERSION}"
          docker buildx imagetools inspect "${IMAGE}:${NGINX_VERSION}-dynamic"
